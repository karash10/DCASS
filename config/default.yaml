# =============================================================================
# DCASS Configuration File
# =============================================================================
# This file contains all configurable parameters for the DCASS system.
# Paths are relative to the project root unless specified as absolute.
# =============================================================================

project:
  name: "DCASS"
  version: "0.1.0"
  description: "Dynamic Context-Aware Semantic Steganography"
  random_seed: 42

# =============================================================================
# Paths Configuration
# =============================================================================
paths:
  data_dir: "storage/data"
  raw_data: "storage/data/raw"
  indices_dir: "storage/data/indices"
  cache_dir: "storage/data/cache"
  models_dir: "storage/models"
  logs_dir: "storage/logs"

# =============================================================================
# Corpus Configuration
# =============================================================================
corpus:
  # Text Corpus (Wikipedia, books, etc.)
  text:
    enabled: true
    source_dir: "storage/data/raw/wikipedia"
    extensions: [".txt", ".md"]
    min_chunk_length: 50
    max_chunk_length: 512
    
  # Image Corpus (Flickr8k)
  image:
    enabled: true
    source_dir: "storage/data/raw/flickr8k"
    captions_file: "storage/data/raw/flickr8k/captions.txt"
    images_dir: "storage/data/raw/flickr8k/images"
    supported_formats: [".jpg", ".jpeg", ".png", ".webp"]
    
  # Audio Corpus (future)
  audio:
    enabled: false
    source_dir: "storage/data/raw/audio"
    supported_formats: [".wav", ".mp3", ".flac"]
    sample_rate: 16000
    max_duration: 30  # seconds

# =============================================================================
# Embedding Models Configuration
# =============================================================================
embeddings:
  text:
    model: "all-MiniLM-L6-v2"
    dimension: 384
    batch_size: 32
    normalize: true
    
  image:
    model: "ViT-B/32"
    dimension: 512
    batch_size: 16
    normalize: true
    
  audio:
    model: "laion/clap-htsat-unfused"
    dimension: 512
    batch_size: 8
    normalize: true

# =============================================================================
# Index Configuration
# =============================================================================
index:
  # FAISS index type: "flat" (exact), "ivf" (approximate), "hnsw" (graph-based)
  type: "flat"
  
  # IVF-specific settings (if type is "ivf")
  ivf:
    nlist: 100      # Number of clusters
    nprobe: 10      # Number of clusters to search
  
  # Text index paths
  text:
    path: "storage/data/indices/text.index"
    metadata_path: "storage/data/indices/text_metadata.json"
    
  # Image index paths
  image:
    path: "storage/data/indices/image.index"
    metadata_path: "storage/data/indices/image_metadata.json"
    
  # Audio index paths
  audio:
    path: "storage/data/indices/audio.index"
    metadata_path: "storage/data/indices/audio_metadata.json"

# =============================================================================
# Model Configuration (Device, etc.)
# =============================================================================
model:
  # Device: "cpu", "cuda", "cuda:0", "cuda:1", or "auto"
  device: "auto"
  
  # Mixed precision (for GPU)
  fp16: false

# =============================================================================
# Encoding Configuration
# =============================================================================
encoding:
  # Default modality for encoding
  default_modality: "image"
  
  # Number of candidates to consider per chunk
  candidates_per_chunk: 1
  
  # Minimum similarity score threshold
  min_similarity: 0.3
  
  # Error correction
  error_correction:
    enabled: true
    redundancy_factor: 1.5

# =============================================================================
# Dynamic Context Configuration
# =============================================================================
context:
  enabled: true
  
  # Default source: "crypto", "weather", "news", "time"
  source: "crypto"
  
  # Update interval in seconds
  update_interval: 3600
  
  # Cryptocurrency source settings
  crypto:
    api_url: "https://api.coingecko.com/api/v3"
    coins: ["bitcoin", "ethereum"]
    # No API key required for CoinGecko free tier
    
  # Weather source settings (requires API key)
  weather:
    api_url: "https://api.openweathermap.org/data/2.5"
    cities: ["london", "new_york", "tokyo"]
    
  # News source settings (requires API key)
  news:
    api_url: "https://newsapi.org/v2"
    sources: ["bbc-news", "cnn"]

# =============================================================================
# Distribution Configuration
# =============================================================================
distribution:
  # Default dispatch policy: "round_robin", "fixed", "alternating", "random"
  default_policy: "round_robin"
  
  # Base delay between dispatches (seconds)
  base_delay: 3
  
  # Async transmission
  async_enabled: true
  
  # Retry settings
  retry_attempts: 3
  retry_delay: 5
  
  # Timeout in seconds
  timeout: 30
  
  # Available channels
  channels:
    console:
      enabled: true
    local_folder:
      enabled: true
      output_dir: "output"
    github:
      enabled: false
      # Requires GITHUB_TOKEN env variable
    imgur:
      enabled: false
      # Requires IMGUR_CLIENT_ID env variable

# =============================================================================
# Stealth AI Configuration
# =============================================================================
stealth:
  # GAN-based behavioral scheduler
  gan:
    enabled: false
    latent_dim: 100
    hidden_dim: 256
    num_layers: 3
    learning_rate: 0.0002
    batch_size: 64
    
  # RL-based adaptive policy
  rl:
    enabled: false
    algorithm: "PPO"
    learning_rate: 0.0003
    gamma: 0.99
    n_steps: 2048
    batch_size: 64

# =============================================================================
# Analysis Configuration
# =============================================================================
analysis:
  # Benchmarking settings
  benchmark:
    enabled: true
    iterations: 100
    message_sizes: [64, 256, 1024, 4096]  # bytes
    warmup_iterations: 10
    
  # Adversarial testing
  adversarial:
    enabled: true
    analyzer_type: "statistical"
    detection_threshold: 0.5

# =============================================================================
# Logging Configuration
# =============================================================================
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  file: "storage/logs/dcass.log"
  console: true
  
  # Loguru-specific settings
  rotation: "10 MB"
  retention: "1 week"
